version: '3.9'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - /tmp/vswap:/tmp/vswap
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VSWAP_REDIS_URL=redis://redis:6379/0
      - VSWAP_CELERY_BROKER_URL=redis://redis:6379/0
      - VSWAP_CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  worker:
    build: .
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2 -Q chunks,stitch
    volumes:
      - ./:/app
      - /tmp/vswap:/tmp/vswap
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VSWAP_REDIS_URL=redis://redis:6379/0
      - VSWAP_CELERY_BROKER_URL=redis://redis:6379/0
      - VSWAP_CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    scale: 2

  flower:
    build: .
    command: celery -A workers.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - VSWAP_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
